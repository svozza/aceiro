# AI PR review — the reusable pipeline (generate → verify → execute)
#
# Consumed with:
#
#   jobs:
#     review:
#       uses: svozza/smtithy/.github/workflows/ai-pr-review.yml@<full SHA>
#       with: { ... }
#       secrets: { ... }
#
# from a workflow triggered on pull_request_target. The harness code the jobs
# run is checked out from THIS repository at `job.workflow_sha` — the same
# commit the caller's `uses:` pin resolved to — so the workflow file and the code
# it invokes cannot drift apart, and the consumer's checkout is never the
# source of the reviewer (ADR-0002: the subject of review must not supply the
# reviewer).
#
# PROCESS (same shape the incumbent ran; see the job comments):
#   author_trust  -> real permission lookup, fail-closed to untrusted
#   approve       -> human gate via the CALLER's `ai-pr-review` environment
#   review        -> asserts the gate was real (ADR-0006), then read-only
#                    generation; holds no write scope
#   post          -> re-verifies and posts; the only pull-requests:write
#
# CONSUMER SETUP — enforced, not advisory (ADR-0006):
# Environments resolve against the CALLER's repository, and GitHub silently
# creates a referenced environment WITH NO PROTECTION RULES. environment_gate.py
# therefore refuses to run an approval-needing review unless the caller's
# `ai-pr-review` environment provably has required reviewers. Create BOTH
# environments before first use:
#   ai-pr-review          required reviewers: at least one maintainer
#   ai-pr-review-runtime  no rules; exists to scope the OIDC subject claim
#
# MODEL ACCESS (ADR-0002's two arms):
#   use-bedrock: true  (default) — OIDC-assume `BEDROCK_ROLE_ARN`, invoke via
#                      Bedrock. infra/oidc-role.yaml deploys the role.
#   use-bedrock: false — direct Anthropic API with `ANTHROPIC_API_KEY`.

name: AI PR review (reusable)

on:
  workflow_call:
    inputs:
      project-description:
        description: >-
          The consumer's own one-clause description of their repository,
          substituted into the reviewer prompt (e.g. "`owner/name`, a Rust
          peer-to-peer file syncer"). Unset, the prompt reviews under its
          measured default wording.
        type: string
        required: false
        default: ""
      use-bedrock:
        description: Bedrock via OIDC role (true) or direct Anthropic API key (false).
        type: boolean
        required: false
        default: true
      aws-region:
        type: string
        required: false
        default: eu-west-1
      bedrock-inference-profile:
        description: Invoked profile; also the session policy's resource and the attribution stamp.
        type: string
        required: false
        default: global.anthropic.claude-opus-4-8
      bedrock-foundation-model:
        description: Foundation-model id the session policy allows (region-wildcarded).
        type: string
        required: false
        default: anthropic.claude-opus-4-8
      cli-model:
        description: >-
          What the CLI is told to use. On Bedrock this is the inference profile
          plus "[1m]" — the suffix is how the 1M context window is requested;
          the CLI tests the model STRING and grants 200k when absent. Kept
          separate from bedrock-inference-profile because a suffixed ARN names
          no real resource. For the API arm, a first-party model name.
        type: string
        required: false
        default: global.anthropic.claude-opus-4-8[1m]
      agent-timeout-minutes:
        description: >-
          How long the review may take. This is the agent's WHOLE budget: it sets
          the generator job's `timeout-minutes`, and the job's first step stamps a
          deadline from it that cc_loop sizes each attempt's wall clock and turn
          ceiling from (ADR-0015). Raise it if reviews of your repository
          legitimately cost more — the wall clock bounds REASONING VOLUME, which
          is a property of your repository and the diff under review, and 50 was
          measured on one repository. A ceiling rather than a reservation: GitHub
          bills elapsed time, so raising it costs nothing until a run uses it.
          Whole minutes only. GitHub terminates any hosted-runner job at 6 hours
          however this is set, and the generator clamps its deadline there.
        type: number
        required: false
        default: 50
      comment-marker:
        description: Hidden HTML marker identifying this generator's sticky comment.
        type: string
        required: false
        default: "<!-- ai-pr-review-sticky-comment -->"
      comment-title:
        type: string
        required: false
        default: "🤖 AI Code Review"
    secrets:
      BEDROCK_ROLE_ARN:
        description: Role assumed via OIDC for the Bedrock arm.
        required: false
      ANTHROPIC_API_KEY:
        description: Direct API key for the non-Bedrock arm.
        required: false

permissions: {}

# One run per PR. Two runs for different head SHAs share the sticky comment's
# marker and bot login, so they contend for one comment and the loser writes
# last -- post.py's withdrawal is scoped to its own reviewed SHA for the same
# reason, and this is what stops the contention arising. Cancelling in progress
# also stops four pushes in two minutes from queueing four approval requests and
# four Bedrock-billed review jobs, three of which could only fail at post.
concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  # The event's base SHA: what the diff is anchored to, and what the review job
  # checks out. Frozen at event time on purpose — a base-branch advance during
  # the approval gate must not change the comparison under review.
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  # The base BRANCH, which is what a retarget changes. The executors' TOCTOU
  # check compares this and not BASE_SHA, because the PR object's live base.sha
  # tracks the branch tip and advances with it.
  BASE_REF: ${{ github.event.pull_request.base.ref }}

jobs:
  # Resolves the author's REAL repo permission (write-or-above), never
  # author_association. Fails closed to untrusted; see author_trust.py.
  author_trust:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      trusted: ${{ steps.resolve.outputs.trusted }}
    steps:
      - name: Refuse to run unpinned
        # job.workflow_sha is the SHA the caller's `uses:` pin resolved to.
        # Empty (old runner, GHES) would make the checkout below silently
        # fall back to the harness's default branch -- the exact drift the
        # pin exists to prevent -- so absence refuses, fail-closed.
        env:
          PINNED_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$PINNED_SHA" ]; then
            echo "::error::job.workflow_sha is empty; cannot pin the harness checkout" >&2
            exit 1
          fi
      - name: Checkout harness (pinned to this workflow's own SHA)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Resolve author permission
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python src/smtithy/author_trust.py

  approve:
    # Human gate: resolves against the CALLER's `ai-pr-review` environment.
    # Authors with write-or-above on a non-draft PR skip it; bots never reach
    # the review job at all. A draft reaches the gate and, once approved, RUNS —
    # the review job carries no draft exclusion, so this request is always one a
    # reviewer can act on (ADR-0006 addendum §4). NOTE this job alone proves
    # nothing — a missing environment passes instantly — which is why the review
    # job re-asserts the gate in code before touching a credential.
    needs: author_trust
    if: >-
      always()
      && github.event.pull_request.user.type != 'Bot'
      && (
        needs.author_trust.outputs.trusted != 'true'
        || github.event.pull_request.draft
      )
    runs-on: ubuntu-latest
    environment: ai-pr-review
    steps:
      - name: Record approved head SHA
        run: echo "Approved AI review for head ${HEAD_SHA}"

  review:
    needs: [author_trust, approve]
    # The skipped branch re-derives trust rather than assuming `skipped`
    # meant "trusted": skipped alone cannot tell "author holds write" from
    # "the gate job failed to run".
    #
    # No draft exclusion: a draft reviews behind the gate, which `approve`
    # requests for it unconditionally. Kept in lockstep with evals.yml — the
    # ADR-0006 addendum reads the two as a pair.
    if: >-
      always()
      && (
        needs.approve.result == 'success'
        || (
          needs.approve.result == 'skipped'
          && needs.author_trust.outputs.trusted == 'true'
        )
      )
    runs-on: ubuntu-latest
    environment: ai-pr-review-runtime
    # The consumer's number, and the same one the generator's deadline is stamped
    # from below (ADR-0015). Verified rather than assumed: jobs.<job_id>.timeout-minutes
    # accepts the `inputs` context.
    timeout-minutes: ${{ inputs.agent-timeout-minutes }}
    permissions:
      contents: read
      pull-requests: read # PR metadata + SHA-anchored diff via API; never write
      id-token: write
    steps:
      # FIRST, so this job's own setup is spent inside the consumer's number rather
      # than on top of it: cc_loop sizes each attempt from the time REMAINING. The
      # variable's name is pinned against cc_loop.DEADLINE_ENV in both directions,
      # a value crossing a job boundary being joined by YAML alone (ADR-0015).
      - name: Stamp the generator deadline
        env:
          AGENT_TIMEOUT_MINUTES: ${{ inputs.agent-timeout-minutes }}
        run: |
          # A `number` input need not be a whole one, and the arithmetic below fails
          # obscurely on a fraction. Refused where the value is read: the generator
          # would receive a valid deadline computed from a nonsense input.
          case "$AGENT_TIMEOUT_MINUTES" in
            ''|*[!0-9]*)
              echo "::error::agent-timeout-minutes must be a whole number of minutes, got '${AGENT_TIMEOUT_MINUTES}'" >&2
              exit 1 ;;
          esac
          echo "SMTITHY_AGENT_DEADLINE=$(( $(date +%s) + AGENT_TIMEOUT_MINUTES * 60 ))" >> "$GITHUB_ENV"

      - name: Checkout consumer trusted base SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
          fetch-depth: 1

      - name: Refuse to run unpinned
        # job.workflow_sha is the SHA the caller's `uses:` pin resolved to.
        # Empty (old runner, GHES) would make the checkout below silently
        # fall back to the harness's default branch -- the exact drift the
        # pin exists to prevent -- so absence refuses, fail-closed.
        env:
          PINNED_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$PINNED_SHA" ]; then
            echo "::error::job.workflow_sha is empty; cannot pin the harness checkout" >&2
            exit 1
          fi
      - name: Checkout harness (pinned to this workflow's own SHA)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: harness
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: harness/uv.lock

      - name: Sync harness dependencies (locked)
        run: |
          uv sync --project harness --frozen --no-install-project
          echo "$GITHUB_WORKSPACE/harness/.venv/bin" >> "$GITHUB_PATH"

      # ADR-0006: the gate is asserted INSIDE the gated job, before any
      # credential exists in the job. If this run needed human approval, the
      # caller's environment must provably have required reviewers — GitHub
      # silently creates referenced environments without any.
      - name: Assert the approval gate was real
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GATE_ENVIRONMENT: ai-pr-review
          AUTHOR_TRUSTED: ${{ needs.author_trust.outputs.trusted }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: python harness/src/smtithy/environment_gate.py

      - name: Prepare SHA-anchored context
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python harness/src/smtithy/prepare_context.py --output-dir "$RUNNER_TEMP/context"

      # Runs after Prepare SHA-anchored context on purpose: that step caps the
      # head tree's per-blob and aggregate size from the tree API, so a tree too
      # large to check out is refused before any of it is transferred. The diff
      # caps cannot do it — a binary addition is a tiny diff with a full blob.
      - name: Quarantine-fetch PR head (bytes only, never executed)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          QUARANTINE="$RUNNER_TEMP/pr-head-quarantine"
          git init --quiet "$QUARANTINE"
          # Fork PR heads are mirrored into the base repo via refs/pull/*/head,
          # so the exact reviewed SHA is fetchable from the base repo only.
          AUTH_HEADER="Authorization: Basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -C "$QUARANTINE" -c http.extraheader="$AUTH_HEADER" fetch --quiet --depth 1 \
            "https://github.com/${GITHUB_REPOSITORY}" "$HEAD_SHA"
          git -C "$QUARANTINE" checkout --quiet FETCH_HEAD
          rm -rf "$QUARANTINE/.git"

          # Strip symlinks: git materialises mode-120000 entries verbatim, and a
          # permission check on the path the generator REQUESTS cannot see where
          # a link points. Deleted rather than resolved — a link's target is not
          # part of the reviewed change. Echoed so a stripped tree is visible in
          # the job log rather than a silent difference from the reviewed head.
          SYMLINKS=$(find "$QUARANTINE" -type l | wc -l | tr -d ' ')
          if [ "$SYMLINKS" != "0" ]; then
            echo "::warning::stripped $SYMLINKS symlink(s) from the quarantine; they are not reviewable content"
            find "$QUARANTINE" -type l -print -delete
          fi
          # Fail closed if any survived.
          if [ "$(find "$QUARANTINE" -type l | wc -l | tr -d ' ')" != "0" ]; then
            echo "::error::symlinks remain in the quarantine after stripping"
            exit 1
          fi

      - name: Configure AWS credentials (Bedrock-invoke only)
        if: ${{ inputs.use-bedrock }}
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.BEDROCK_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}
          mask-aws-account-id: true
          inline-session-policy: >-
            {
              "Version": "2012-10-17",
              "Statement": [{
                "Effect": "Allow",
                "Action": ["bedrock:InvokeModel", "bedrock:InvokeModelWithResponseStream"],
                "Resource": [
                  "arn:aws:bedrock:${{ inputs.aws-region }}:*:inference-profile/${{ inputs.bedrock-inference-profile }}",
                  "arn:aws:bedrock:*::foundation-model/${{ inputs.bedrock-foundation-model }}"
                ]
              }]
            }

      - name: Run review agent
        env:
          CLAUDE_CODE_USE_BEDROCK: ${{ inputs.use-bedrock && '1' || '' }}
          ANTHROPIC_API_KEY: ${{ !inputs.use-bedrock && secrets.ANTHROPIC_API_KEY || '' }}
          ANTHROPIC_MODEL: ${{ inputs.cli-model }}
          SMTITHY_PROJECT_DESCRIPTION: ${{ inputs.project-description }}
          # No telemetry, no auto-update inside a credential-bearing job.
          DISABLE_TELEMETRY: "1"
          DISABLE_ERROR_REPORTING: "1"
          DISABLE_AUTOUPDATER: "1"
          # Run-scoped, never the workspace: the CLI writes session state here
          # and the workspace is the code under review.
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-config
        run: |
          python harness/src/smtithy/cc_loop.py \
            --base-root "$GITHUB_WORKSPACE/base" \
            --pr-root "$RUNNER_TEMP/pr-head-quarantine" \
            --context-dir "$RUNNER_TEMP/context" \
            --output-dir "$RUNNER_TEMP/review-output"

      - name: Assemble artifact bundle
        id: assemble
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          cp "$RUNNER_TEMP/review-output/"* "$RUNNER_TEMP/bundle/" 2>/dev/null || true
          # pr.json included so the exact model input is reconstructible. The
          # diff and file list travel as evidence only: post.py re-fetches both
          # rather than verifying against these copies.
          cp "$RUNNER_TEMP/context/diff.patch" \
             "$RUNNER_TEMP/context/changed_files.json" \
             "$RUNNER_TEMP/context/pr.json" \
             "$RUNNER_TEMP/bundle/" 2>/dev/null || true
          # A step failing BEFORE the agent leaves the bundle empty; uploading it
          # anyway makes "No files were found" the job's last line, burying the
          # refusing step's own reason. Skipped instead — the guard on a run that
          # produced output is the upload step's if-no-files-found: error.
          if [ -n "$(ls -A "$RUNNER_TEMP/bundle")" ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "bundle is empty: the job stopped before producing output — the failing step above has the reason"
          fi

      - name: Upload review artifact
        if: always() && steps.assemble.outputs.has_files == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-review-${{ github.event.pull_request.number }}-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/bundle/
          retention-days: 90
          if-no-files-found: error

  post:
    # review already needs approve; its success implies the gate passed.
    needs: review
    if: always() && needs.review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # contents:read is what re-fetching the SHA-anchored diff needs. The
      # executor re-verifies provenance against a comparison it establishes
      # itself, because a diff supplied by the job that ran the generator makes
      # verify()'s provenance phase only as strong as that job.
      contents: read
      pull-requests: write
    steps:
      # The verifier MUST come from the pinned harness, never the artifact
      # and never the consumer's tree.
      - name: Refuse to run unpinned
        # job.workflow_sha is the SHA the caller's `uses:` pin resolved to.
        # Empty (old runner, GHES) would make the checkout below silently
        # fall back to the harness's default branch -- the exact drift the
        # pin exists to prevent -- so absence refuses, fail-closed.
        env:
          PINNED_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$PINNED_SHA" ]; then
            echo "::error::job.workflow_sha is empty; cannot pin the harness checkout" >&2
            exit 1
          fi
      - name: Checkout harness (pinned to this workflow's own SHA)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync verifier dependencies (locked)
        run: |
          uv sync --frozen --no-install-project
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Download review artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-review-${{ github.event.pull_request.number }}-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/bundle

      - name: Verify and post (fail-closed)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # No model input here: the attribution stamp comes from the bundle's
          # run_metadata.json, written by the arm that actually invoked a model.
          # Via env, not inline interpolation: an input inside a run: block is
          # shell-expanded, and these two are free-text.
          COMMENT_MARKER: ${{ inputs.comment-marker }}
          COMMENT_TITLE: ${{ inputs.comment-title }}
        run: |
          python src/smtithy/post.py \
            --artifact-dir "$RUNNER_TEMP/bundle" \
            --policy src/smtithy/policy.json \
            --prompt prompts/ai-pr-review.md \
            --marker "$COMMENT_MARKER" \
            --title "$COMMENT_TITLE"
