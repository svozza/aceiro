name: Quality check

# PROCESS
#
# The deterministic test suite for the harness: goldens, the adversarial
# corpus, and hypothesis property tests. No external calls, no secrets, no
# credential of any kind — so it runs on every pull request from any branch
# and any fork, and blocks on any failure.
#
# THIS WORKFLOW HOLDS NO CREDENTIAL, AND THAT IS WHY IT NEEDS NO GATE. A
# standing rule, not a note about a stage the repo has passed: the two workflows
# are split on exactly this line. Everything needing a secret lives in
# evals.yml, which executes the PR's own harness code against a live Bedrock
# credential and therefore carries the human gate ADR-0006 describes. This one
# runs on `pull_request` from any branch and any fork with no approval gate at
# all, so a secret-bearing step added here would hand that secret to unreviewed
# fork code. A step needing a credential belongs in evals.yml's gated job.
#
# One runner. The harness is all Python: the TypeScript plan prover and the
# differential job that compared the two gates were retired when the port
# direction reversed (the ADR superseding ADR-0003 records the decision and the
# evidence). The defect class the differential caught — a policy key one gate
# enforced and the other ignored — is now guarded in-process by
# plan_verify.check_plan_policy_keys and its tests, which refuse a policy key
# no reader consults.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-check-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test_verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout code only
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (hash-pinned)
        run: |
          pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Run verifier tests
        run: python -m pytest tests/ -p no:cacheprovider -q

  # ADR-0017: the type checker is what makes the parsed-step signatures teeth
  # rather than documentation. Its own job, deliberately NOT a step inside
  # test_verifier: ty is a compiled artifact acceptable only as a CI-only dev
  # tool, and a separate job keeps it out of every other job's environment —
  # it never runs where a credential lives. Holds no secrets, runs on every
  # pull request from any fork, same as the job above.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout code only
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies and the checker (hash-pinned)
        # requirements.txt too: ty resolves third-party imports from the
        # environment it is pointed at, so the harness's real dependencies
        # must be present or every import reads as unresolved.
        run: |
          pip install --require-hashes -r requirements.txt -r requirements-typecheck.txt
      - name: Type-check the harness
        run: ty check --python "$(which python)"
