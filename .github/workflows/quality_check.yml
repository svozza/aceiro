name: Quality check

# PROCESS
#
# The deterministic test suite for the artifact verifier: goldens, the
# adversarial corpus, and hypothesis property tests. No external calls, no
# secrets, no credential of any kind — so it runs on every pull request from
# any branch and any fork, and blocks on any failure.
#
# This is deliberately the ONLY job in the repo right now. The eval suite
# (real model calls against fixed scenarios) is step 2 of the extraction and
# arrives with its own workflow: it executes the PR's own harness code against
# a live credential, so it needs the human gate that ADR-0006 describes, and
# mixing it in here would put a secret behind a job that currently needs none.
#
# TWO RUNNERS, deliberately (ADR-0003). pytest covers the artifact verifier,
# which stays Python because its risk is markdown-it rendering behaviour and a
# hand-tabulated Unicode table. node --test covers the plan prover, which is
# TypeScript because its risk is reachability reasoning. Both run for the whole
# duration of the verifier's eventual port, since the Python is the differential
# oracle for it -- the second runner is not saved until the port finishes.
#
# Separate jobs rather than one: a prover failure and a verifier failure are
# different problems, and reading which one broke off the job name is worth more
# than the few seconds a shared checkout would save.
#
# THE THIRD JOB IS THE SEAM ITSELF. test_verifier and test_prover run different
# corpora over different code, so neither can see a policy that one gate enforces
# and the other ignores — which is how plan.ordering came to be read by the
# prover and by no Python code at all with a green suite. test_gate_differential
# feeds ONE plan to BOTH gates and compares the verdicts, the guard ADR-0003
# specifies for the port. It needs both toolchains in one job because that is the
# whole point of it, and the differential SKIPS when the prover is unbuilt, so
# the build step here is load-bearing rather than incidental.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-check-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test_verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout code only
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (hash-pinned)
        run: |
          pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Run verifier tests
        run: python -m pytest tests/ -p no:cacheprovider -q

  test_prover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout code only
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies (lockfile-pinned)
        # `ci`, not `install`: it installs exactly the lockfile and fails if
        # package.json disagrees with it, which is the npm equivalent of the
        # --require-hashes above.
        run: npm ci
      - name: Typecheck
        # Separate from the test run so a type error reads as a type error. The
        # strict set is load-bearing for the prover: a plan arrives as parsed
        # JSON, so every field access is an "is it there?" question.
        run: npm run typecheck
      - name: Run prover tests
        run: npm test

  test_gate_differential:
    # One plan, both gates, same verdict. The only job that can catch a policy
    # the two implementations disagree about, so it holds both toolchains.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout code only
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies (pinned both sides)
        run: |
          pip install --require-hashes -r requirements.txt -r requirements-dev.txt
          npm ci
      - name: Build the prover
        # The differential invokes dist/plan/prove-cli.js as a subprocess and
        # SKIPS if it is absent, so this step is what keeps the guard from
        # passing vacuously.
        run: npm run build
      - name: Assert the prover is built
        # Belt and braces on the line above: a skipped differential looks green,
        # which is the exact failure mode this job exists to prevent.
        run: test -f dist/plan/prove-cli.js
      - name: Run the differential corpus
        run: python -m pytest tests/test_plan_gate_differential.py -p no:cacheprovider -q
