name: Evals

# PROCESS
#
# Real model calls against fixed scenarios (planted bugs, prompt-injection
# payloads, a clean PR) graded against known-correct outcomes. This catches
# prompt and model regressions that a schema or logic test cannot see, and it is
# the only job in this repository that holds a credential.
#
# It EXECUTES the PR's own harness and eval code against a live credential. It
# has to: the code under test IS the PR's diff, so a base-SHA checkout (the shape
# a review job would use) would run main's stale copy and never catch a
# regression or verify a fix. Running a PR's own code with a live secret is the
# "pwn request" problem, and it is only safe behind a human gate that resolves
# BEFORE a single line of that code is checked out or run.
#
# TRIGGERS
#
# Every pull request (opened/synchronize/reopened), because in this repo every
# PR is a harness change and the evals are the only test of the behaviour the
# harness exists to produce (ADR-0008, revised: the label-only cadence assumed
# per-PR cost was prohibitive; measured, a full run is on the order of a
# dollar). The `labeled` trigger is the manual re-run for an unmoved head,
# dispatch takes runs/scenario knobs, and the weekly schedule stays — it
# catches upstream model drift, which no PR of ours would trigger. The human
# gate is orthogonal to cadence and unchanged: untrusted or draft authors wait
# at the environment on every one of these paths. cancel-in-progress keeps a
# rapid push train from queueing suites; only the newest head's run survives.
#
# --runs 1 IS THE DEFAULT, DELIBERATELY
#
# run_evals.py accumulates total_failed across runs and exits non-zero if any
# scenario failed on any run, so --runs 3 is three independent chances to catch a
# flake rather than majority voting. The two settings answer different questions:
# --runs 1 asks whether the harness works, --runs 3 asks whether a behaviour is
# stable. Use 3 before merging a prompt, policy or verifier change; 1 otherwise.
# A single green run is NOT evidence of stability -- that is the misreading
# ADR-0008 exists to guard against.
#
# GATE CORRECTNESS: two environments, two different jobs
#
# The configuration below mirrors the repository this was extracted from, read
# from its live API rather than inferred:
#
#   ai-pr-review          required_reviewers, no branch policy    <- THE GATE
#   ai-pr-review-runtime  branch policy only, NO reviewers        <- scopes the
#                                                                    credential
#
# Both halves are load-bearing and each has already been got wrong:
#
# 1. Binding the gate to the RUNTIME environment makes it resolve instantly,
#    gating nothing -- the credential-scoping environment has no reviewers, so
#    there is no human in the loop. That is the staging repo's recorded defect.
# 2. Putting reviewers ON the runtime environment (done here first, wrong) is the
#    opposite error and is just as bad in its own way. eval_approve deliberately
#    SKIPS for an author holding write-or-above on a non-draft pull request, and
#    skips entirely on dispatch and schedule -- but a protected runtime
#    environment blocks the evals job regardless, so every path waits for a click
#    and the trust distinction the conditional exists to express is overridden by
#    configuration. Fail-closed rather than fail-open, so nothing leaks, but a
#    gate that fires for everyone carries no signal about anyone.
#
# The runtime environment's protection is a BRANCH POLICY: only main may reach
# the credential. That is also why pull_request_target is load-bearing here --
# the policy checks the ref the RUN executes under, which for
# pull_request_target is the base branch, whereas pull_request resolves to
# refs/pull/N/merge and would never match.
#
# The configuration is not self-verifying, which is why ADR-0006's in-code
# assertion runs INSIDE this job:
# docs/adr/0006-addendum-observed-gate-failures.md records four ways the gate has
# silently failed open with no run going red.

on:
  # Every pull request, on open and on every push (ADR-0008 addendum: the
  # original label-only trigger assumed per-PR cost was prohibitive; measured,
  # a full suite run is on the order of a dollar, and in this repo every PR is
  # a harness change — exactly what the evals grade). `labeled` is kept as the
  # manual re-trigger for a PR whose head has not moved. The human gate below
  # is unchanged: untrusted and draft authors still wait at the environment
  # before their code runs with the credential. pull_request_target for the
  # same reason the review path uses it: the workflow definition comes from
  # the base branch, so a fork cannot rewrite the gate that is about to gate
  # it.
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      runs:
        description: "Independent runs. 1 asks whether the harness works; 3 asks whether a behaviour is stable."
        required: false
        default: "1"
        type: choice
        options: ["1", "3", "10"]
      scenario:
        description: "Run only this scenario (default: all)."
        required: false
        type: string
      workers:
        description: "Concurrent scenarios per suite. Lower it if Bedrock starts throttling; watch api_errors in results.json."
        required: false
        default: "4"
        type: choice
        options: ["1", "2", "4", "6"]
  schedule:
    # Weekly on the default branch. Catches upstream model drift, which is the
    # one regression no pull request of ours would ever trigger.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: evals-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-west-1
  BEDROCK_INFERENCE_PROFILE: global.anthropic.claude-opus-4-8
  BEDROCK_FOUNDATION_MODEL: anthropic.claude-opus-4-8

jobs:
  # Resolves the author's REAL repository permission so the jobs below can branch
  # on trust without consulting author_association -- which reports a social
  # relationship, not access. A read-only outside collaborator reports
  # COLLABORATOR, the same value a maintainer reports on a private repo.
  #
  # Holds no secrets, so it cannot hand anything to code it checks out.
  eval_author_trust:
    # On a `labeled` event only the run-evals label proceeds (any other label
    # on a PR is noise, not a request); opened/synchronize/reopened always do.
    if: >-
      github.event_name != 'schedule'
      && (
        github.event_name != 'pull_request_target'
        || github.event.action != 'labeled'
        || github.event.label.name == 'run-evals'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # check out the resolver
      pull-requests: read # the collaborator-permission lookup
    outputs:
      trusted: ${{ steps.resolve.outputs.trusted }}
    steps:
      - name: Checkout resolver
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The BASE ref, always: the pull request must never supply the code
          # that decides whether to trust the pull request.
          ref: ${{ github.event.pull_request.base.sha || '' }}
          persist-credentials: false
          fetch-depth: 1
      - name: Resolve author permission
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python src/smtithy/author_trust.py

  eval_approve:
    # The human gate. Authors with write-or-above on a non-draft pull request
    # skip it; everyone else waits for a maintainer to approve the environment
    # that actually HAS required reviewers. A draft therefore reaches the gate
    # and, once approved, RUNS: the job below carries no draft exclusion, so
    # this request is always one a reviewer can act on (ADR-0006 addendum §4).
    needs: eval_author_trust
    if: >-
      always()
      && github.event_name == 'pull_request_target'
      && (github.event.action != 'labeled' || github.event.label.name == 'run-evals')
      && github.event.pull_request.user.type != 'Bot'
      && (
        needs.eval_author_trust.outputs.trusted != 'true'
        || github.event.pull_request.draft
      )
    runs-on: ubuntu-latest
    environment: ai-pr-review
    steps:
      - name: Record approval
        run: echo "Approved evals for head ${{ github.event.pull_request.head.sha }}"

  evals:
    needs: [eval_author_trust, eval_approve]
    # always(), because eval_approve is SKIPPED (not absent) on the trusted-author
    # path and on schedule/dispatch. The skipped branch re-derives trust from
    # eval_author_trust rather than trusting that the gate was skipped for a good
    # reason: `skipped` alone cannot distinguish "author holds write" from "the
    # gate job itself failed to run".
    #
    # No draft exclusion: a draft runs behind the gate (ADR-0008), which
    # eval_approve requests for it unconditionally. Excluding drafts here would
    # make every draft approval request unanswerable AND leave a PR whose last
    # push happened in draft with no eval coverage at all.
    if: >-
      always()
      && (
        github.event_name != 'pull_request_target'
        || github.event.action != 'labeled'
        || github.event.label.name == 'run-evals'
      )
      && (
        needs.eval_approve.result == 'success'
        || (
          needs.eval_approve.result == 'skipped'
          && (
            github.event_name == 'schedule'
            || github.event_name == 'workflow_dispatch'
            || needs.eval_author_trust.outputs.trusted == 'true'
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # BEDROCK_ROLE_ARN is read here, and the role's trust policy requires this
    # exact environment in its subject claim -- so a run that cannot reach this
    # environment cannot mint a usable token even if it held the ARN.
    environment: ai-pr-review-runtime
    permissions:
      contents: read
      id-token: write # Bedrock role assumption only; no pull-requests scope
    steps:
      # TRUSTED CHECKOUT FIRST, so the gate below is asserted by BASE-BRANCH
      # code: asking the PR's own code whether the PR was approved is no check.
      # `path:` keeps it out of the workspace root, which the PR checkout owns.
      - name: Check out the base-branch harness (trusted)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: trusted-base
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          # NO pip cache here. This job executes PR-head code, and
          # setup-python's cache save is an implicit POST step that runs after
          # it; under pull_request_target the entry lands in the BASE BRANCH's
          # cache scope, reachable from main and every other PR. The install is
          # hash-pinned, so the cache bought little.

      # ADR-0006: asserted INSIDE the gated job, before any credential exists AND
      # before the PR's code is on disk. A missing or protection-free environment
      # makes eval_approve succeed automatically. Stdlib-only, so it needs no
      # dependency install first.
      - name: Assert the approval gate was real
        # Only pull_request_target is environment-gated; schedule and dispatch
        # have no PR and legitimately have no gate.
        if: github.event_name == 'pull_request_target'
        working-directory: trusted-base
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GATE_ENVIRONMENT: ai-pr-review
          AUTHOR_TRUSTED: ${{ needs.eval_author_trust.outputs.trusted }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: python src/smtithy/environment_gate.py

      - name: Check out the PR head (the code under test)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Deliberately the pull request's OWN head SHA: the default ref for
          # pull_request_target is the base branch, but the code under test must
          # be the PR's. Only reached after eval_approve resolved for this SHA
          # AND the gate assertion above passed.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # This job EXECUTES the checked-out code. The default leaves the job
          # token in .git/config, where that code could read it and act as the
          # workflow. Load-bearing here, not hygiene.
          persist-credentials: false
          # Do not wipe trusted-base/ while cleaning the workspace root; the PR
          # tree still lands in the root, where every step below expects it.
          clean: false
      # The generator (claude-agent-sdk) installs here too: the SDK wheel
      # bundles the Claude Code CLI binary, so the hash pin below covers both.
      # tests/test_cc_loop.py asserts the bundled CLI version, so a wheel that
      # silently ships a different generator fails the suite. This step runs
      # BEFORE the Bedrock role is assumed, so nothing during install can reach
      # the credential.
      - name: Install harness dependencies (hash-pinned)
        env:
          # See "NO OIDC MINTING BELOW" on the credential step.
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        run: pip install --require-hashes -r requirements.txt
      - name: Configure AWS credentials (Bedrock-invoke only)
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.BEDROCK_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
          # Belt and braces over the role's own policy: the session cannot exceed
          # this even if the role were later widened.
          inline-session-policy: >-
            {
              "Version": "2012-10-17",
              "Statement": [{
                "Effect": "Allow",
                "Action": ["bedrock:InvokeModel", "bedrock:InvokeModelWithResponseStream"],
                "Resource": [
                  "arn:aws:bedrock:${{ env.AWS_REGION }}:*:inference-profile/${{ env.BEDROCK_INFERENCE_PROFILE }}",
                  "arn:aws:bedrock:*::foundation-model/${{ env.BEDROCK_FOUNDATION_MODEL }}"
                ]
              }]
            }
      # NO OIDC MINTING BELOW. `id-token: write` puts
      # ACTIONS_ID_TOKEN_REQUEST_URL and ...REQUEST_TOKEN in every step's
      # environment, and every step from here on EXECUTES the PR's own code. That
      # pair is a standing capability to mint a fresh OIDC token, so PR-controlled
      # code could assume the role again with NO inline session policy -- getting
      # whatever the role's IDENTITY policy permits and bypassing the
      # Bedrock-only bound the step above applies. The inline policy is described
      # there as belt and braces over the role's own policy; against code that can
      # re-assume, it is neither.
      #
      # smtithy's role grants two Bedrock actions and nothing else
      # (infra/oidc-role.yaml), so nothing leaks here today. The exposure is a
      # CONSUMER supplying a wider role and relying on the inline policy, which
      # is exactly what that comment invites. Shadowed rather than argued about:
      # configure-aws-credentials has already used the pair, and nothing after it
      # needs it. tests/test_workflow_shape.py asserts this over every step that
      # runs PR-head code, so a new step cannot reintroduce it silently.
      - name: Run review eval scenarios
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          CLAUDE_CODE_USE_BEDROCK: "1"
          ANTHROPIC_MODEL: ${{ env.BEDROCK_INFERENCE_PROFILE }}
          DISABLE_TELEMETRY: "1"
          DISABLE_ERROR_REPORTING: "1"
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-config
          # No --base-root: BASE is per-scenario now, fetched from the pinned
          # commit in each scenario's base.json. --cache-dir is only where those
          # fixtures land.
          RUNS: ${{ inputs.runs || '1' }}
          SCENARIO: ${{ inputs.scenario }}
          # Peak concurrent `claude` processes, and therefore peak concurrent
          # Bedrock request streams. The two suites are sequential STEPS, so this
          # is the whole run's ceiling rather than half of it. Measured at 4 with
          # --runs 3: 0 api_errors, 0 backoff seconds — so 4 is the default
          # because it is known-safe here, not because it is cautious.
          WORKERS: ${{ inputs.workers || '4' }}
        run: |
          set -euo pipefail
          python src/smtithy/evals/run_evals.py \
            --output-dir "$RUNNER_TEMP/eval-output" \
            --cache-dir "$RUNNER_TEMP/eval-base-cache" \
            --runs "$RUNS" \
            --workers "$WORKERS" \
            ${SCENARIO:+--scenario "$SCENARIO"}
      # The plan generator's suite (run_plan_evals.py), same credential, same
      # session. `if: always() && ...` so a review-scenario failure still
      # produces plan results in the same run — the two suites grade different
      # generators, and one's regression should not hide the other's state.
      # Skipped when a single review scenario was requested by name: --scenario
      # names are suite-specific, and cross-applying one would either error or
      # silently run everything.
      - name: Run plan eval scenarios
        if: always() && inputs.scenario == ''
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          CLAUDE_CODE_USE_BEDROCK: "1"
          ANTHROPIC_MODEL: ${{ env.BEDROCK_INFERENCE_PROFILE }}
          DISABLE_TELEMETRY: "1"
          DISABLE_ERROR_REPORTING: "1"
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-config
          RUNS: ${{ inputs.runs || '1' }}
          WORKERS: ${{ inputs.workers || '4' }}
        run: |
          set -euo pipefail
          python src/smtithy/evals/run_plan_evals.py \
            --output-dir "$RUNNER_TEMP/plan-eval-output" \
            --runs "$RUNS" \
            --workers "$WORKERS"
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evals-${{ github.run_id }}
          # Both runners redact the captured stream and transcript with the
          # policy's secret patterns before writing, which is what makes a
          # 30-day artifact of a live model session acceptable.
          path: |
            ${{ runner.temp }}/eval-output/
            ${{ runner.temp }}/plan-eval-output/
          retention-days: 30
