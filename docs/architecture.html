<style>
  .viz-root {

  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --role-model: #d95926;
      --role-verify: #3987e5;
      --role-human: #199e70;
      --role-exec: #9085e9;
      --status-good: #0ca30c;
      --edge: #52514e;
      --panel: #222221;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --role-model: #d95926;
    --role-verify: #3987e5;

  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .viz-root { background: var(--page); color: var(--text-primary); min-height: 100vh; padding: 24px; }

  header { max-width: 1400px; margin: 0 auto 16px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 20px; font-weight: 650; }
  header p  { color: var(--text-secondary); font-size: 13px; }
  .spacer { flex: 1; }
  .theme-btn {
    font: inherit; font-size: 12px; color: var(--text-secondary);
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 10px; cursor: pointer;
  }

  .layout { max-width: 1400px; margin: 0 auto; display: flex; gap: 16px; align-items: flex-start; }
  .canvas-wrap {
    flex: 1; min-width: 0; background: var(--surface-1); border: 1px solid var(--border);

  }
  .canvas { position: relative; width: 1040px; height: 700px; }
  .canvas svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .lane-label {
    position: absolute; left: 14px; font-size: 11px; font-weight: 650; letter-spacing: 0.08em;

  .node {

    background: var(--surface-1); border: 1px solid var(--baseline); border-radius: 8px;
    border-left-width: 4px; cursor: pointer; transition: box-shadow .12s, transform .12s;
    font-size: 12px; line-height: 1.25;
  }
  .node:hover, .node:focus-visible { box-shadow: 0 2px 10px rgba(0,0,0,.18); outline: none; transform: translateY(-1px); }
  .node.selected { box-shadow: 0 0 0 2px var(--text-primary); }
  .node.lit { box-shadow: 0 0 0 2px var(--hl, var(--role-verify)); }
  .node .k { font-weight: 650; display: block; color: var(--text-primary); }
  .node .s { color: var(--text-secondary); font-size: 11px; display: block; margin-top: 2px; }
  .node .badge { position: absolute; top: -8px; right: -6px; font-size: 10px; line-height: 1;

  .node.exec   { border-left-color: var(--role-exec);   --hl: var(--role-exec); }

  path.edge { stroke: var(--edge); stroke-width: 1.5; fill: none; }
  path.edge.reject { stroke-dasharray: 5 4; }
  path.edge.reads  { stroke-dasharray: 2 4; }
  path.edge.lit    { stroke: var(--hlc); stroke-width: 2.5; }
  .edge-label { font-size: 10px; fill: var(--text-muted); }
  .edge-label.lit { fill: var(--hlc); font-weight: 600; }

  .panel {
    width: 340px; flex-shrink: 0; background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; position: sticky; top: 16px; font-size: 13px;

  }
  .panel h2 { font-size: 15px; margin-bottom: 2px; }
  .panel .role-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px;
    color: var(--text-secondary); margin: 4px 0 10px; }
  .role-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .panel p { color: var(--text-secondary); line-height: 1.5; margin-bottom: 10px; }
  .panel .files { font-family: ui-monospace, monospace; font-size: 11px; color: var(--text-secondary);
    background: var(--page); border: 1px solid var(--grid); border-radius: 6px; padding: 8px; margin-bottom: 10px; }
  .panel .ev { border-left: 3px solid var(--status-good); padding: 2px 0 2px 10px; margin-bottom: 10px;
    color: var(--text-secondary); line-height: 1.5; }
  .panel .ev b { color: var(--text-primary); }
  .panel .pend { border-left: 3px solid var(--baseline); padding: 2px 0 2px 10px; color: var(--text-secondary); line-height: 1.5; }
  .panel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); margin: 14px 0 6px; }

  .controls { max-width: 1400px; margin: 0 auto 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .controls span { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .07em; margin-right: 4px; }
  .flow-btn {
    font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 999px; cursor: pointer;

  .flow-btn:hover { border-color: var(--text-secondary); }
  .flow-btn.on { border-color: var(--text-primary); font-weight: 600; }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin: 0 auto 10px; max-width: 1400px;
    font-size: 12px; color: var(--text-secondary); align-items: center; }
  .legend .item { display: inline-flex; align-items: center; gap: 6px; }
  .legend .dash { width: 22px; border-top: 2px dashed var(--edge); display: inline-block; }
  .legend .dot2 { width: 22px; border-top: 2px dotted var(--edge); display: inline-block; }
  .legend .pendbox { width: 14px; height: 14px; border: 1px dashed var(--baseline); border-radius: 4px; display: inline-block; }
</style>
</head>
<body>
<div class="viz-root" id="root">
  <header>
    <h1>smtithy — generate → verify → execute</h1>
    <p>What exists today, how an artifact flows, and where every gate sits. Click any node.</p>

<script>
const NODES = [
  // ---------- review lane (y=64) ----------
  { id:'pr',    x:12,   y:64,  role:'data',   title:'Pull request', sub:'the subject under review',
    desc:'A PR event freezes the trust decision: the workflow definition and policy come from the base branch, the PR’s content is quarantined data. Everything downstream treats the diff, description, and head tree as contributor-authored data, never instructions.',
    files:'.github/workflows/ai-pr-review.yml', ev:null, pend:null },
  { id:'ctx',   x:140,  y:64,  role:'exec',   title:'prepare_context', sub:'SHA-anchored context',
    desc:'Builds the fixed context the generator sees: the diff at the reviewed head SHA, changed_files, the PR description — each fenced with every invisible code point replaced by a visible <code>&lt;U+XXXX&gt;</code> marker, so fenced content cannot terminate its own fence AND a Trojan-Source construct stays legible to the reviewer rather than being silently sanitised into ordinary-looking code. One diff walk (diff_map) feeds both the line numbers shown to the model and the lines provenance later accepts, so they cannot drift. Caps the diff, the file count AND the collected list’s own bytes (a count bounds no bytes: 300 deeply nested paths are ~150 KB the diff cap cannot see), and the head tree’s per-blob and aggregate size — the last from the tree API, before the quarantine transfers any of it, because a binary addition is a tiny diff carrying a full blob.',
    files:'prepare_context.py · diff_map.py · artifact.py', ev:'<b>2064</b> deterministic tests cover the fence escaping, the Unicode default-ignorable table, and the single diff walk — including the anchor signature’s NFC and indentation-only normalization, which is the identity key the reconciler keys comment threads on.', pend:null },
  { id:'gen',   x:268,  y:64,  role:'model',  title:'Review generator', sub:'cc_loop · Claude via Agent SDK',
    desc:'Reads two roots (trusted BASE, quarantined PR head) with Read/Grep/Glob only — no Bash, no Write, no network, no ambient config, safe-mode. Submits through the in-process submit_review tool; a rejected submission gets the verifier’s real reason as tool feedback and retries in the same session. A breaker aborts after 3 identical rejections or 4 submissions, counted over the whole run so an API-error retry cannot forgive an abort — and over every way a submission can fail, since an uncounted harness fault loops until the turn limit and then blames the turn budget. A turn-limit exit AFTER an acceptance keeps the verified artifact; the transcript records both the configured model and the one that answered. The result envelope classifies the session (ADR-0019): the CLI exits non-zero ON PURPOSE after an error result and the SDK re-raises that exit as a bare Exception AFTER the envelope arrived, an exception that once escaped the whole retry ladder and killed a run whose artifact was already verified — so once the envelope is captured, a predicate matching exactly the SDK&rsquo;s wrapper shape (never our own exceptions, which must stay crashes) discards the exception and the envelope decides: the api_error arm matches <code>terminal_reason</code> OR the CLI&rsquo;s documented failing-API-call shape (<code>is_error</code> with <code>subtype: success</code>, the one combination carrying <code>api_error_status</code> — logged, not decided on), delivers a verified artifact before it retries, and any OTHER error envelope fails named by its own subtype rather than as &ldquo;completed without calling submit_review&rdquo;, a false reason for a session that died. Both ceilings are the CONSUMER&rsquo;S: one <code>agent-timeout-minutes</code> input sets the job&rsquo;s <code>timeout-minutes</code> and, stamped into the environment by the job&rsquo;s FIRST step so setup is spent inside it, the deadline each attempt&rsquo;s wall clock is computed from &mdash; time REMAINING less a reserve for the artifact upload, not the job timeout divided by the retry count, since a wall-clock timeout does not retry and dividing rationed two thirds of every job against a worst case never observed. The turn ceiling is DERIVED from that clock and kept above it, so the clock binds first and a review that runs out of room reports the budget the consumer set rather than a constant measured on one repository (ADR-0015). An absent deadline falls back to the module&rsquo;s own constants, which is what direct invocation needs and what makes the workflow&rsquo;s variable name a bidirectional pin rather than a convention. The room each attempt was granted is recorded beside what it spent, since only a timeout reported itself before.',
    files:'cc_loop.py · prompts/ai-pr-review.md', ev:'Live: <b>12/12</b> review scenarios across 3 local runs (2026-08-10), including every injection scenario and <code>grouped_cross_file_defect</code> — which grades ADR-0013’s grouping, since the verifier bounds the field and deliberately never checks the claim. The reviewer grouped the split defect identically on all three runs. Graded at FINDING granularity, not path: keyed on the path the assertion intersected per-path group SETS, so any one finding per path agreeing satisfied it and the two halves of the defect could sit in DIFFERENT groups with a third finding bridging them — the harness then renders a cross-reference coupling an unrelated note with one half while the real other half gets none. The <code>strays</code> half was blind to the same shape from the other side, since it exempts wanted paths, so one computation closes both. <code>constants.py</code> stays OUT of <code>grouped_paths</code> deliberately, and the fixture records why: the scenario measures a willingness to UNDER-group, but adding it was measured worse — <code>grouped_paths</code> requires a finding on every path it names and no run files one there, so the answer the reviewer actually gives would fail. That is <code>plan_multi_file_fix</code>’s failure mode, a fixture no achievable answer satisfies. Both it and <code>provenance_boundary_adjacent_bug</code> now appear in the two meta-test lists that pin every other planted-bug scenario’s line and diagnosis substance — they were the only scenarios carrying both keys while appearing in neither, so their fixtures could be hollowed out with the suite green (<code>line_in</code> 8&nbsp;→&nbsp;9 plus both <code>body_contains_any</code> blocks deleted left 1953 passing, after which a vague finding on the wrong line grades as a pass). The lists are hand-kept, so a reverse assertion now derives them: a scenario asserting a line and absent from the pin list FAILS, which is what let the ninth scenario land unpinned in the first place.', pend:null },
  { id:'ver',   x:396,  y:64,  role:'verify', title:'verify()', sub:'4 phases, fail-closed, whole artifact', gate:true,
    desc:'The security boundary. Allowlists a safe grammar; anything outside rejects the whole artifact: (1) strict schema — whose spec VALUES are swept first, so a pattern this engine cannot compile or a non-integer bound is a policy fault rather than a crash mid-check, (2) provenance — every finding’s path is a changed file and its line is inside a diff hunk, (3) markdown AST allowlist — link hosts (dot-segment traversal out of a path prefix rejected), no images/HTML/@-mentions, closed fences, no reference definitions, and canonical text: invisible/bidi controls and non-NFC input are REJECTED rather than normalized, so the posted text is the checked text (ADR-0011) — GFM extensions are enabled in order to REJECT them, since a construct GitHub renders structurally must be one the parser produces a node for: a pipe table verified as prose under bare CommonMark and rendered as an authoritative table, (4) secret scan over raw, invisible-stripped, and rendered text — including link destinations.',
    files:'verify.py · policy.json', ev:'The adversarial corpus (~490 lines) is the executable threat model; a case that starts passing is a regression.', pend:null },
  { id:'art',   x:524,  y:64,  role:'data',   title:'review.json', sub:'verified, inert',
    desc:'The artifact is data. It carries no version field (a model-supplied schema version is a model-selected policy — ADR-0004), and it does nothing until the executor renders it.',
    files:'review.json · transcript.jsonl (audit, secret-redacted)', ev:null, pend:null },
  { id:'post',  x:652,  y:64,  role:'exec',   title:'post.py executor', sub:'holds the write token', gate:true,
    desc:'The only process with pull-requests:write. Re-verifies against provenance inputs it fetches itself — the SHA-anchored diff and changed-file list, not the review job’s copies of them — so the provenance phase is no weaker than the phases that read only the artifact. Re-checks the head SHA and the base BRANCH before posting (TOCTOU: drift means refuse, not adapt — but the live base.sha tracks the branch tip, so a benign advance is not a retarget, ADR-0012), renders the verified artifact into one marker-keyed sticky comment with the AI notice, the policy hash and the model the generator recorded actually answering (not a configured one — both arms are configured on every run — constrained to an identifier charset, since the stamp is spliced inside a code span and the bundle it comes from is the job this one distrusts), and trusts no claim from any other job. A rejection here names the value it refused, so the message is redacted before it reaches the job log — the transcript and the stream capture were, and a log has its own retention and audience. Runs are serialized per PR, and the post-write withdrawal is scoped to the comment still carrying this run’s reviewed SHA, read from the LAST LINE rather than searched for anywhere in the body — render() splices findings, summary and residual risk ABOVE the footer, all of them generator text quoting the contributor’s diff, so a body-wide search let a planted <code>reviewed SHA: `&lt;sha&gt;`</code> witness a review that was never posted for that head. The footer is the only part the executor authors. Same containment trade as the marker-from-line-1 rule, and it fails closed: an unrecognised comment is no witness and withdraws nothing. Comment ownership is the marker as the EXACT FIRST LINE plus the author resolved from the token itself (through the one GraphQL helper that inspects the errors array, since a partially-errored 200 carries a usable login): a substring match owned any comment merely quoting the marker, and an empty marker owned every one. Duplicates a lost race already left behind are reconciled — the oldest carries the review, the rest are retired and give up the marker.',
    files:'post.py · github_api.py · author_trust.py · environment_gate.py', ev:'Ported behaviour-preserving from the incumbent reviewer with its test suite.', pend:null },
  { id:'cmt',   x:780,  y:64,  role:'human',  title:'Review comment', sub:'a human reads it',
    desc:'The visible effect: one sticky review comment. The human reader is the quality control the verifier deliberately is not — the verifier bounds what can be said and where, never whether it is right. Each finding carries a REQUIRED <code>group</code> integer (ADR-0013), and same-valued findings CLAIM to be one defect — the reviewer is the only participant that ever knows a defect was split across files, and a commander cannot type <code>/fix 1,3</code> without being told. Required rather than optional because a fail-closed verifier cannot tolerate optional fields (ADR-0004); bounded by a range and a distinct-group cap but never BELIEVED, since whether two findings are one defect is ADR-0005’s unverifiable content question. The two bounds are about different things: the range bounds each VALUE, the cap bounds the PARTITION — how finely one artifact may split its findings. The cap is only a bound BELOW <code>min(max_items, |group range|)</code>, and it shipped AT that number with zero tests, so <code>len(distinct) &gt; 10</code> was unsatisfiable and every arm of the check was dead code reading as a safety property. Now 4, measured against the most demanding shipped scenario, with a test asserting the SHIPPED value is satisfiable — derived from the policy, so a future <code>max_items</code> bump fails here instead of silently re-vacating the cap. The cross-reference is rendered HERE, by <code>post.render</code>, and that is the point: <code>rendered_findings</code> sorts by severity at render time and the model never sees the sorted list, so a model-authored “see also finding 3” would name a DIFFERENT REAL FINDING whenever the two orders differ — the silent wrong-finding failure ADR-0007’s second addendum exists to prevent. Singletons render nothing, because one finding per group is the ordinary case and a note on every finding is noise that teaches readers to skip the ones that matter. A group is advisory prose to a human, and no code in the fix lane may read it: enforced by ADR-0004’s policy-coverage assertion run in REVERSE — this field has NO reader in the fix lane, which is DERIVED as the import closure of the modules <code>ai-pr-fix.yml</code> actually runs rather than listed, because the list drifted to 8 modules under a comment claiming all 19 and the one omission a reader could widen a scope from (<code>artifact.py</code>, host of <code>rendered_findings</code>) was scanned by nothing. The scan resolves the imported constant, since <code>finding[GROUP_FIELD]</code> is this repository’s own spelling of the read and carries no string literal a token scan can match — a developer copying the only existing reader wrote the evading spelling by default. Calibrated against SOURCE FIXTURES, one per arm, not against the live corpus: the field the old calibration used appears as a bare name everywhere and as a string literal nowhere, so the string arm was killable with the suite green. <code>post.py</code> and <code>verify.py</code> are exempt and each states why, the way <code>SINGLE_GATE_KEYS</code> names its exemptions, and an exemption that exempts nothing fails. Otherwise the group authorises a write, which is the model-chosen scope ADR-0013 opens by refusing.',
    files:'post.render (the cross-reference) · prompts/ai-pr-review.md v5 · tests/test_group_is_advisory.py', ev:'<b>12</b> tests on the cross-reference alone, including the artifact’s order and the rendered order deliberately DISAGREEING, and every model-authored field filled with a decoy ordinal. <b>25</b> more on the no-reader condition itself, each scanner arm calibrated by a source fixture that fails when that arm is killed, and the whole assertion checked against the real widening written into <code>plan_loop</code> and into <code>artifact.py</code> in the house idiom.',
    pend:null },

  // ---------- shared policy ----------
  { id:'pol',   x:524,  y:186, role:'data',   title:'policy.json', sub:'the reviewable security object',
    desc:'One declarative policy, read by the artifact verifier and the plan gate. Its sha256 is stamped into every transcript and posted comment. A plan-block key NO check reads is refused (the allowlist), and every shipped key must also have a consuming reader — the retired differential oracle’s purpose, inherited in-process (ADR-0016).',
    files:'policy.json', ev:'Shipped-policy tests pin its facts — e.g. open_pr has no base arg (the merge target is never model-suppliable).', pend:null },

  // ---------- remediation lane (y=292) ----------
  { id:'fix',   x:12,   y:292, role:'human',  title:'/fix N,M command', sub:'a maintainer commands findings', gate:true,
    desc:'Remediation is commanded per finding by a trusted commander (ADR-0007). <code>issue_comment</code> runs the DEFAULT BRANCH’s workflow and always carries a write token, whoever commented — the same trap as <code>pull_request_target</code>, reached from a channel anyone can write to. So the <code>command</code> job holds no model credential and no write scope, and every refusal lands there: the body must BE a command (exact, whole-comment — a body quoting one is not one), the COMMENT author must hold write-or-above, the issue must be a pull request, and a review this harness posted must exist for the head being commanded. TWO trust questions from two people, deliberately: the commander’s permission authorises the fix, while the PR AUTHOR’s decides whether a human approves before their content meets a credential — ADR-0006’s question, not ADR-0007’s — so a maintainer commanding a fix on a first-time contributor’s PR still waits at the gate. The command names a SET of findings (ADR-0013): <code>/fix 1,3</code> asserts they take ONE remediation, and the commander is the only source of that scope which is neither the model’s nor the harness’s — a coordinated multi-file fix cannot be scoped from one anchor, and the harness never judges whether two findings are one defect. What it bounds is the SHAPE: one ASCII comma, the empty set is not a command, duplicates collapse, and the count is capped by the same <code>max_items</code> the ordinal is, so an untrusted body cannot make the parse walk an arbitrary list. One bad ordinal refuses the WHOLE command — delivering the subset that resolves would be a scope the harness chose. The ordinals are 1-based for humans and 0-based in the bundle; <code>fix_command</code> is the only place that conversion happens. Serialized per PR but never cancelled: a command is a discrete instruction, so newer-wins would discard a maintainer’s. Deduplicated on (pr, head_sha, findings) over the SET, so <code>/fix 3,1</code> and <code>/fix 1,3</code> are one command while <code>/fix 1</code> then <code>/fix 1,3</code> is honoured as a WIDENING; a moved head means refuse. One refusal is DERIVED here and replied to (ADR-0014): a multi-path command on a FORK pull request has no delivery at all — the fix must touch every commanded path, a review comment carries one <code>path</code>, and a fork’s head branch does not exist in this repository for a stacked PR to be based on. Knowable at command time from the pull request object this job already fetches, so it costs seconds instead of the approval gate, a model session, both gates and a <code>contents: write</code> job. This job still holds NO write scope: it emits the reason and the <code>reply</code> job posts it. Every OTHER refusal here stays a red run, and that is a security property — the untrusted-commander refusal is reached BEFORE trust is resolved, so replying to it would let any passer-by make the harness post a comment naming them. A distinct <code>Undeliverable</code> class carries the replying cases, so a new refusal is silent unless someone chooses it deliberately, rather than a hand-maintained security exemption list.',
    files:'ai-pr-fix.yml · fix_command.py · prepare_fix_context.py · author_trust.py (the commander’s login)', ev:'<b>74</b> tests on the parse and the command channel, plus a <b>70</b>-test workflow-shape suite holding the lane to it: no write scope or model credential in the command job, three writers and no more, the comment body never interpolated into a run: block, and the gate-lane list checked against the workflows so a new credential-bearing lane cannot go unasserted.',
    pend:null },
  { id:'fnd',   x:140,  y:292, role:'data',   title:'review.json + ordinals', sub:'the commanded findings are DERIVED',
    desc:'The commanded finding is not supplied — it is derived, which is what makes “an element of the accepted review artifact” a checked property rather than a claim. A bare finding.json used to be the input, so a well-shaped finding no accepted artifact contained passed on shape alone: a forged one could direct a real remediation at a defect no reviewer ever found, on any file in the PR. Both review engines raised it, and it was closed on REACHABILITY — no workflow composed this directory — which is exactly what wiring the /fix channel removes. So both gates now run the review verifier over review.json (provenance, markdown allowlist, secret scan — the same gate that accepted it) and index it by the ordinal. No signing key is needed, because neither gate compares its input against another job’s copy; each accepts the artifact it holds. Each ordinal is a RENDERED position (artifact.rendered_findings): /fix 3 means the third finding of the comment the commander read, while review.json holds model order, so indexing it directly would silently remediate a different real finding. Every per-element bound survives the widening to a set and each is asserted on its own — <code>bool</code> is an <code>int</code> in Python so <code>true</code> resolves <code>findings[1]</code>, and a negative value is the one out-of-range ordinal that silently resolves to a real finding — plus three the SET adds: the container must be a list (a bare string is iterable, so <code>"01"</code> would read as two ordinals nobody typed), it may not be empty, and duplicates collapse. The file is written SORTED, so it is a function of the set and not of the typing order. The artifact itself is bound to the run that POSTED the review, read from that comment’s footer run link: the name <code>ai-review-&lt;pr&gt;-&lt;sha&gt;</code> is derivable from two public values and the artifact listing is repository-wide, so name-and-recency let any same-named artifact in the repository become the trust anchor — choosing which defect a <code>/fix N</code> addresses and what text the plan session reads inside the fence. Refused when no run can be established, rather than falling back. Plus the identical SHA-anchored context the reviewer saw — the plan is anchored against the same diff the review was, or anchor and review could disagree.',
    files:'context/review.json · commanded_index.json · diff.patch · changed_files.json', ev:'Both gates derive through one reader; the executor passes the diff it fetched itself, so the artifact is never accepted against the bundle’s own copy.', pend:null },
  { id:'pgen',  x:268,  y:292, role:'model',  title:'Plan generator', sub:'plan_loop · same session shape',
    desc:'A second cc_loop-style session: same read-only tools, same deny-list, same breaker — literally the same drive_session loop, with submit_plan swapped in. The prompt mandates the smallest correct fix for the one commanded finding, and “copy old from the PR head root, verbatim”: the honest path is the easy path. Reads the same SMTITHY_PROJECT_DESCRIPTION seam the reviewer does — it did not, so a consumer’s planner was shown another project’s example path while being told every path must be a file this PR changed. Prompt is marked DRAFT until the reply channel is measured.',
    files:'plan_loop.py · prompts/ai-pr-plan.md (DRAFT)', ev:'Live: <b>5/5</b> plan scenarios in CI + 15/15 across 3 local runs — scope discipline, injection resistance, multi-file shape all held.', pend:null },
  { id:'pver',  x:396,  y:292, role:'verify', title:'verify_plan()', sub:'parse → typed steps · ordering · containment · markdown · secrets', gate:true,
    desc:'ADR-0005: containment, not quality control. The schema phase PARSES rather than validates (ADR-0017): <code>parse_plan</code> returns typed Steps — same checks, same first-violation-wins rejections — and every later phase takes those Steps, so a phase reading model output the schema never proved is inexpressible rather than guarded against; in src/ only the parser constructs a Step, and the executor’s delivery applies the steps <code>verify_plan</code> returned. Ordering —the legal write chain (patch → push_branch → open_pr), enforced where the process holding the write token re-verifies rather than trusting another job’s claim. Frame — every patched path is a file the PR touched (exact identity). Denylist — deliberate glob port (** spans separators; fnmatch does not). Write-class targets — every pushable branch confined to the harness-owned <code>branch_prefix</code> and never the reviewed PR’s own head branch (ADR-0009 addendum), every label on a <code>label_allowlist</code> that ships empty, and <code>open_pr.branch</code> equal to the branch <code>push_branch</code> pushed — confining each independently still let a plan push the verified patch to one branch and open the follow-up PR from another, whose bytes no frame bounded: these are the arguments deciding where <code>contents: write</code> points, and they are model-supplied. Cardinality — one suggestion per file (ADR-0009): a suggestion is its own one-click commit, so two on one file can be half-applied, which is the state the atomicity argument refuses. Patch steps are deliberately not bounded that way, becoming one commit on the stacked branch. Scope — the commanded finding’s file must be AMONG the fix’s paths (ADR-0007 addendum), because that scope was enforced by the prompt alone and a plan patching the PR’s other files passed every other gate; among rather than equal to, or ADR-0009’s multi-file stacked fix would be refused. suggest.line — same in-hunk provenance as findings, AND placement: old must begin at the addressed line AND end at a line end, so the region a suggestion replaces is the region its anchor proved — an anchor stopping mid-line left the rest of that line overwritten by bytes no anchor covered, and a last-line suggestion on a file with no final newline must still verify. Two more rules exist because a suggestion is delivered THROUGH markdown, where the verifier’s replace() model and GitHub’s applier can disagree: <code>new</code> may not drop the line terminator <code>old</code> carried (a block’s lines are always committed terminated, so the join that described was verified and then not performed), and may carry neither CR nor NUL (CommonMark folds CRLF to LF and substitutes U+FFFD before any applier sees them, so the committed bytes would not be the checked ones — refused rather than normalised, since folding a CRLF file’s endings would rewrite its convention). A patch’s <code>new</code> is exempt from both: the executor writes that file directly. And <code>suggest.note</code> may not carry a ```suggestion fence of its own — the note is checked as prose ONLY, so such a block is appliable bytes that anchoring, bounding and the secret scan never saw, rendered above the real one and reached first. Specs themselves are validated before any step is read, eagerly rather than where the value is consumed: a spec key no reader consults, a <code>minimum</code> that is not an integer, and a <code>pattern</code> the gate&rsquo;s OWN engine cannot compile as the enforcer will compile it. <code>{"minimum":"bogus"}</code> loaded and read as a floor, then raised TypeError from the middle of a check — a crash where the caller expects a verdict. Eager because a lazy check reaches only the kinds a plan happens to use, leaving a malformed write-class spec latent. Scalars — lengths counted in Unicode code points, integers required to be integer LEXEMES, and no unpaired surrogate: <code>1.0</code> parses to the same double as <code>1</code>, and a lone <code>\ud800</code> is legal JSON that no UTF-8 encoder takes — rules the retired two-language seam surfaced (ADR-0016), kept because each closes a real hole in this gate alone. Markdown — every arg a reader sees goes through the artifact verifier’s own allowlist, <code>open_pr.title</code> included: it carried a pattern excluding only CR and LF, which is not ADR-0011’s unconditional invariant on posted text, so a title could render in the PR list as an approval the harness never gave. Bounds — ≤3 files, and ≤120 lines AND ≤8000 bytes per step over a ≤16000-byte plan budget, because a line count bounds nothing about line LENGTH: a minified line is one line carrying arbitrary content. Anchoring — old must byte-match the PR head exactly once: zero matches means the model wasn’t looking at the file, two means the write is ambiguous and refused — counted over overlapping start offsets, since a non-overlapping count calls an ambiguous write unique.',
    files:'plan_verify.py · tests/test_plan_verify_adversarial.py (57 near-misses)', ev:'Anchoring runs against the quarantine tree via a confined content source — symlinks out of the tree read as missing. THE plan gate since ADR-0016: the differential corpus retired with the prover after confirming this side is a superset across 97 cases.', pend:null },
  { id:'plan',  x:524,  y:292, role:'data',   title:'plan.json', sub:'straight-line, literal args',
    desc:'A steps array of {id, kind, args} — no control flow, no bindings, no version field (ADR-0004’s three reserved closures). Kinds today: suggest, patch, push_branch, open_pr, label. ADR-0010 adds create behind an allowlist that ships empty — written, gated on a grill-with-docs session.',
    files:'plan.json · transcript.jsonl', ev:null, pend:null },
  { id:'pexec', x:780,  y:292, role:'exec',   title:'Plan executor', sub:'delivery is ITS decision', gate:true,
    desc:'Re-verifies the plan in-process (trusts no other job) against provenance inputs it fetches itself — the SHA-anchored diff and changed-file list, never the plan job’s copies — so the frame condition is quantified over files this process established. The commanded finding is DERIVED in the bundle rather than supplied: review.json and the ordinal are both INPUTS to the scope gate, fail-closed like plan.json, and this process re-verifies the artifact with the review verifier before indexing it — so membership in an accepted review is structural here too, and the only thing that cannot be re-derived is the ordinal, since which finding a maintainer commanded is a fact about the command. Then it picks delivery from checkable structure — never the model’s choice: one path, one hunk → suggestion comments; a fix spanning files → the stacked follow-up PR, whose merge is atomic where per-file suggestions are not (ADR-0009). Refuses what no delivery carries: mixed kinds, multi-file suggestions, a stacked PR on a fork. Two suggestions on ONE file are refused HERE as well as by cardinality in both gates (ADR-0009 addendum C, given its trigger by ADR-0013): a suggestion is independently applicable, so a pair can be half-applied, and the gate cannot tell a coordinated pair from an independent one — so it refuses the shape. The decision counted distinct PATHS and never counted regions, so this shape returned suggestions and posted both; that is the half of ADR-0009’s atomicity rule the ADR called “checkable from the verified plan’s step list” while nothing checked it. Refusing it at both places is not two readers of one property but the same re-decision every other arm here is — a rejection at the gate is feedback a session can retry against, a refusal here is the last thing between a verified plan and a write. And a plan with NO fix step: a fixless write chain was ordered legally, bounded no path for the frame to quantify over, and so verified clean at both gates while reaching <code>contents: write</code> and remediating nothing &mdash; the executor&rsquo;s refusal was the only guard. It stays as defence in depth, since the executor re-decides rather than trusting a gate ran. BOTH deliveries are built, and they are ALTERNATIVES rather than a fallback chain: a plan deciding the stacked PR is never delivered as suggestions, since the atomicity a PR’s merge has is the whole reason that mode was chosen. WHICH JOB delivers is chosen by a credential-free router holding <code>permissions: {}</code>, reading step kinds and nothing else, so a suggestion run never mints <code>contents: write</code> — the scope shrink ADR-0009 records with approval, kept even though the two deliveries need two different credentials. That router reads an UNVERIFIED plan, so unverified model output decides which credential gets minted; the concession is bounded to exactly which job STARTS, because each delivery job is the SOLE full gate for its own path — re-fetching, re-deriving and re-verifying for itself — and each passes <code>--allow</code>, naming the one mode it may perform. A plan misrepresenting its own mode therefore mints a credential and then cannot use it: a self-inflicted denial of service with no benefit. Ownership is resolved from the write token itself before the first write, and the identity key’s window comes from the quarantine tree it already read for anchoring. Drift is re-checked AFTER the write as well as before it — the pre-check and the POST are not atomic and several live calls sit between them — and the failure withdraws nothing: the comments are bound to the reviewed SHA by <code>commit_id</code>, so GitHub marks them OUTDATED rather than misplacing them, and deleting them would destroy correctly-outdated suggestions and any thread beneath them. The run fails so the commander sees it; the comments stay to be read. Retraction is scoped to the commanded FINDINGS as a SET (ADR-0013), while each comment’s marker line records the ONE finding it was delivered for — a comment speaks for exactly one, and what carries a set is the command. Not to their files: two findings of one accepted artifact routinely share a file, so a path was the set TWO commands speak for and <code>/fix 2</code> deleted <code>/fix 1</code>’s live suggestion — or struck it with a note claiming it left the latest remediation. A comment whose own finding cannot be established is left standing. The set is what makes a widening tidy up after itself: <code>/fix 1,3</code> in one file reconciles with both keys in scope, so the earlier <code>/fix 1</code> comment is retracted with no new mechanism. The stacked path is a REPLY producer three times over (ADR-0014, widened by ADR-0018): <code>AlreadyDelivered</code>, a STRANDED delivery (the post-push 422/403, which leave a fix branch standing — the run stays red and the reply names the state to clean up), and the delivered RECEIPT all emit as outputs, because the dedup key needs anchor signatures over the quarantine tree that the command job never fetches and the write calls themselves are where the other two are knowable — emitted rather than posted, since making the job holding the lane’s broadest credential the one that talks to humans would split the reply into two implementations that must agree on their text.',
    files:'execute_plan.py (re-verify + decision) · route_delivery.py (which job) · suggest.py · stack.py', ev:'<b>DELIVERED IN PRODUCTION 2026-08-13</b> — artel PR #62, opened by <code>/fix 1,2</code> and stacked onto the pull request it fixes, which closes ADR-0009 addendum C’s finding that stacked delivery had NO reachable trigger through <code>/fix</code>. The trigger was the one ADR-0013 predicted, not an engineered one: two commanded findings on distinct paths, so no suggestion can carry the fix. The defect was genuinely coordinated — a predicate taking the ASKING side, passed the side being asked about at both call sites — and the consumer’s own CI then passed on the delivered fix INCLUDING its tests, so the suite had never covered the inversion in either direction. The run found three defects no unit test had: a generator budget too small for the review’s REASONING VOLUME (first misdiagnosed as provider latency, from a streaming <code>usage</code> snapshot that under-reported one run’s output by 200x — ADR-0015), a 403 from <code>POST /pulls</code> escaping as a traceback where <code>create_ref</code>’s 422 already became a Refusal, and a consumer setting (<code>can_approve_pull_request_reviews</code>) that gates PR creation independently of the <code>pull-requests: write</code> scope — which is why suggestions worked for months and this did not. <b>101</b> tests: the decision’s whole case analysis, TOCTOU + fork gates, a tampered bundle that cannot make a path provenant, and what reaches the reconciler — the fetched diff, the tree-derived window, only the suggest steps, the verified head SHA. The plurality is asserted on the WIRING and not only on the gate: the file’s only <code>indices</code> fixture was <code>[0]</code> against a one-finding review, so <code>xs</code>, <code>xs[:1]</code>, <code>reversed(xs)</code> and <code>(f(xs[0]),)</code> were indistinguishable across all 130 tests and four collapses of the command to one finding survived. A second two-finding bundle now spies the set at the gate’s own parameter, compares the dedup key against the ONE-finding key (a narrowed key is well-formed; only that comparison tells them apart), and refuses a plan missing the second commanded path — the one narrowing that genuinely opens the gate, since nothing behind <code>verify_plan</code> re-checks.',
    pend:null },
  { id:'sug',   x:908, y:250, role:'human',  title:'Suggestion block', sub:'contributor clicks Apply', gate:true,
    desc:'The default delivery, and the only one that works on fork PRs. The commit lands on the contributor’s branch through their deliberate click — the last point a human sees the actual bytes before they join a merge candidate. Anchoring self-extinguishes once applied (old stops matching). The reconciler is PORTED from the staging repo’s inline-comment generation rather than re-derived, because its history is a catalogue of live-measured failures: identity is the anchored CODE (prose was reworded on every run, and GitHub re-anchors a live comment when the diff shifts, so neither a title nor a line number is a key); retraction is reply-aware and never “resolves”, since resolved asserts the defect was addressed and the harness cannot know that; new comments go up BEFORE stale ones come down, because the review POST is atomic; spent review wrappers are superseded best-effort, since creation has no upsert and a submitted review cannot be deleted — and both bodies are now SELF-DATING (ADR-0009 addendum B): the live one records the head and paths it delivered for, and a spent one reads that stamp back rather than restating the SUPERSEDING run’s facts, because the pass takes no scope and a body claiming a scope its run never had was measured false on artel #61. The skip that avoids rewriting the wrapper just posted moved from a body-equality to a marker, since neither body is a constant once both carry a SHA; and content is compared with the executor-authored lines stripped by POSITION — and with line endings normalised, since only one side of that comparison came back from GitHub — or the footer’s per-run URL rewrites every comment every run. Retraction is scoped to the COMMANDED FINDINGS, as a SET (ADR-0007, ADR-0013): one run delivers the findings one command named while the listing is the whole pull request, so an unscoped pass withdrew every OTHER finding’s live suggestion, claiming it had left the latest remediation and severing the human thread beneath it. What a COMMENT records stays one finding’s key — a comment speaks for exactly one, and what carries a set is the command — and that asymmetry is what pays for the widening: <code>/fix 1,3</code> with both anchors in one file is ONE suggestion (cardinality permits one per path), so the earlier <code>/fix 1</code> comment is in scope, absent from the wanted set, and retracted with no new mechanism. The comment addresses the range <code>old</code> REPLACES, not just its first line: GitHub swaps the addressed range for the block’s lines, so a verified multi-line collapse addressed at one line committed the replacement and left the lines it was meant to absorb. What the gate does NOT ask is whether the spanned lines are lines a commanded finding named: a span may cover uncommanded lines between two findings and rewrite them, and a span may cover only ONE of two commanded findings and deliver half the command. ADR-0013’s claim that two same-file findings “produce one contiguous replacement — which is correct” was struck rather than enforced (2026-08-10): a finding anchors to the changed line RESPONSIBLE, never to the defect, so requiring the fix to cover the anchored line would refuse the harness’s own measured-correct answer — in <code>grouped_cross_file_defect</code> the anchor is the use site and the fix is the import. Pre-existing and not the set-valued command’s doing: the placement logic is byte-identical on <code>main</code> and the shape is reachable through a single <code>/fix N</code>. ADR-0005’s accepted position — anchoring and the caps bound where a fix lands and how much it changes, never which lines within that region — with the human merge as the control. The suggestion fence is longer than the longest backtick run in the content, so file bytes — deliberately not markdown-checked — cannot close the block and pull the AI-generated notice inside it.',
    files:'suggest.py · diff_map.anchor_signatures', ev:'<b>129</b> tests, including the reconciler driven TWICE against a fake GitHub carrying run 1’s real output into run 2 — the churn defects live in that inter-run state, and a hand-authored picture of run 1 encodes only what the author believes it posted.', pend:null },
  { id:'spr',   x:908, y:334, role:'human',  title:'Stacked follow-up PR', sub:'base = the reviewed head', gate:true,
    desc:'The fallback for atomic multi-file fixes, same-repo only. Cut from the reviewed head SHA, based on the PR’s own branch — merging the fix updates the open PR and re-triggers review; broken code never lands on the default branch. open_pr deliberately has no base argument, so the merge target is never model-suppliable: the base is the reviewed PR’s own head branch, read from the live PR context. Committed through blobs → tree → commit → ref rather than the contents API, for containment rather than style — that API is one VISIBLE commit per file onto a branch that must already exist, and POST is never retried, so a mid-sequence failure would leave a branch carrying half a fix and no PR. Blobs, trees and commits are UNREFERENCED objects, invisible until the final ref creation, which is also the deduplication’s compare-and-swap: it 422s on a branch that already exists, so two concurrent commands cannot both win. The committed bytes come from the SAME applier the verifier’s anchoring phase runs, so what was bounded, denylisted and secret-scanned is what lands. Its trigger is a consequence of the command’s scope rather than something engineered to fit the vehicle (ADR-0013): two commanded findings on distinct paths mean the fix must touch both, a review comment carries exactly one <code>path</code>, so <code>decide_delivery</code> routes here because the plan genuinely spans files. No prompt expression rule changed to reach it. <code>plan_multi_file_fix</code> is now the first EVAL to reach this path — it was unsatisfiable before (one commanded ordinal on constants.py while the grader required two other files, which the scope gate refuses), so its measured 0/3 was the fixture and not the model; 3/3 as a two-finding command. Still never run against a real pull request. It carries ADR-0007’s (pr, head_sha, findings) dedup key as a marker on LINE 1 of the PR body — the one position model text cannot reach — matched with the authenticated author, and searched across CLOSED PRs too so a maintainer who closed a fix is not overruled by a repeat command. The key is over the SET, with each finding’s component HASHED before the fold: <code>/fix 3,1</code> and <code>/fix 1,3</code> are one command and cannot open two PRs, while <code>/fix 1</code> then <code>/fix 1,3</code> is honoured as a WIDENING — refusing it would mean a commander who narrowed too far could never widen. A widening that crosses from suggestions to a stacked PR can leave the earlier command’s suggestion live beside it; accepted, not fixed (ADR-0009 addendum D), because the only route there is a commander who ignored the harness’s own cross-reference, and if the contributor applies the orphan the head moves and GitHub shows the stacked PR as conflicting — the half-fix cannot land silently. A command is not idempotent the way a push is: two maintainers typing /fix 3 must not produce two branches and two PRs. Identity inside the key is the anchored CODE, since the model rewords a finding on essentially every run. That key is right here, where the premise dies with the head, and wrong for suggestions, where the head churns exactly when the suggestion does not.',
    files:'stack.py · github_api (the tree write path)', ev:'<b>59</b> tests: each component of the key on its own (a reworded or re-graded finding keys the same; a different PR, head or defect does not, and no signature text can impersonate the unanchored fallback), the key over the SET (typing order is not in it; a widening is; and no signature can forge a second component — each component is hashed before the fold because a signature is contributor code and may carry any separator, so a crafted file could otherwise make <code>/fix 1</code> key as <code>/fix 1,3</code> and refuse every later command for the pair), marker-from-line-1 ownership, the call sequence, and every refusal landing before the first write.',
    pend:null },

  { id:'dec',   x:908, y:418, role:'exec',   title:'Reply comment', sub:'the command’s terminal state', gate:true,
    desc:'ADR-0014, widened by ADR-0018: the command channel replies with the command’s terminal state — a DECLINE or a delivered RECEIPT. Neither a new artifact kind nor a plan step kind — a reply the COMMAND CHANNEL posts to the person who commanded. <code>prepare_fix_context.Refused</code> already meant “someone commanded a fix and the harness will not perform it”; what was missing was an ADDRESSEE, not vocabulary. A <code>decline</code> step was refused three times over: cardinality exists precisely to stop a fixless plan verifying, it would spend a model session to learn a fact the harness established first, and it would put a HARNESS limitation into model-authored prose. The undeliverable derivation resolves the commanded ordinals in RENDERED order, like every other ordinal reader: <code>/fix 3</code> is the third finding of the comment the commander read, and <code>review.json</code> holds model order. Reading model order made the decline fire on the wrong command in BOTH directions — a deliverable same-file command refused with a comment naming a file it never touched, and a genuinely undeliverable one composing a context anyway, which is the whole cost this channel was built to avoid. Reachable by obeying the harness: the cross-reference composes its <code>/fix N,M</code> in rendered ordinals and says to type it verbatim, and 864 of 9472 harness-authored commands were falsely declined on a fork. Every fixture in the lane was already severity-sorted, and a sorted fixture cannot tell the two orders apart. THE CRITERION (ADR-0018), not an enumeration: the channel replies when the harness has a terminal ANSWER to the command and that answer is not already surfaced on the commanding pull request; a run whose machinery failed stays a red run. Four cases pass — undeliverable-by-construction (a multi-path command on a fork) from <code>command</code>, and from <code>stack</code>: <code>AlreadyDelivered</code>, a STRANDED delivery (the post-push 422/403, a fix branch standing that silence made the commander hunt for — finding 0002’s PR #17), and the delivered RECEIPT (the follow-up PR that GitHub never cross-links from the commanding one — PR #17/#18). The suggestion lane’s success is its own receipt, landing on the commanding pull request; pre-push stack refusals are shapes a verified plan cannot present, so reaching one is the machinery failing. The producers split because the replies are knowable in different places: the dedup key needs anchor signatures over a quarantine tree the command job never fetches, and the stranded pair and the receipt are facts of the write calls themselves. The untrusted-commander refusal must NEVER be replied to: trust is resolved as <code>prepare_fix_context</code>’s second step, so a reply there is one any passer-by could trigger, naming themselves, under the harness’s authenticated identity — so a distinct <code>Undeliverable</code> class carries its replying cases and a new refusal is silent unless someone chooses it deliberately, rather than a hand-maintained security exemption list — and the exclusion is by CONSTRUCTION, since every reply producer runs downstream of trust resolution. This job holds <code>pull-requests: write</code> and <code>command</code> holds none, which is the property the whole ADR turns on: <code>command</code> is reached directly from <code>issue_comment</code>, upstream of the trust check, so a write scope there is one minted for anybody who types <code>/fix 1</code>. Credential-free job DECIDES, scoped job ACTS — <code>route</code> → <code>execute</code>/<code>stack</code> reused. Marker-keyed PER COMMAND (head SHA + ordinals, ADR-0018) and UPSERTED, with a prefix that is deliberately NOT the reviewer’s: sharing one would make the two lanes fight over a single comment. Per-command rather than per-PR because a receipt is a CROSS-LINK: one shared marker would let a second command’s receipt upsert away the first’s pointer, recreating the invisible-delivery gap the receipt closes. Retries of ONE command still upsert one comment — accumulation only ever came from retries, the nine-wrapper pile the first ADR-0009 addendum measured — and each comment converges to that command’s CURRENT terminal state: a decline replaced by the receipt once the remedy is applied, a receipt replaced by <code>AlreadyDelivered</code>’s pointer to the same PR on a re-run. The body carries the head SHA and the ordinals it spoke for, so an upsert that destroys the previous text never leaves a claim a later run must correct. The reason is harness-authored PROSE but not harness-DERIVED: the undeliverable reason interpolates the commanded paths, and a path must name a file the pull request touched, so a CONTRIBUTOR authors that text. Three docstrings and this ADR said otherwise, and the guard they called defence in depth was load-bearing: <code>emit</code> refuses a value carrying the <code>GITHUB_OUTPUT</code> heredoc delimiter, the path pattern admitted <code>SMTITHY_DECLINE_EOF</code> as a substring, and a contributor naming a file after it suppressed their own decline on a fork — the very silence this channel removes, reached through the mechanism that removes it, self-serve since they control both the fork-ness and the filename. Suppression only: closing the heredoc needs a line consisting solely of the delimiter and the pattern forbids newlines. The delimiter now carries <code>+</code> and <code>=</code>, which no legal path can express — asserted against the PATTERN, not against a list of guesses — and the guard still REFUSES rather than escapes, because an escape is a fail-open answer to a value that should not exist.',
    files:'reply.py · prepare_fix_context (the undeliverable derivation) · execute_plan (the stack-side producers)', ev:'<b>45</b> tests, including the untrusted-commander refusal asserted NOT to reply — driven through main() as well as the exception type, since it is the emitted output that starts the posting job. The producer-to-poster wiring is pinned in BOTH directions against one declared mapping: the producers write job OUTPUTS and the poster reads ENVIRONMENT VARIABLES, and only the workflow joins them, so a one-character typo in either name made the decline a red run that posted nothing — the exact silence this channel exists to remove. Verified: it left the whole suite green before the assertion existed.', pend:null },

  // ---------- CI lane (y=488 / 560) ----------
  { id:'cipr',  x:12,   y:524, role:'data',   title:'Any PR event', sub:'opened · synchronize · label',
    desc:'As of ADR-0008 (revised): every pull request runs the full eval suites, not just labeled ones — measured, a full pass costs on the order of a dollar, and every PR here is a harness change, which is exactly what the evals grade. The run-evals label survives as the re-trigger for an unmoved head.',
    files:'.github/workflows/evals.yml · quality_check.yml', ev:null, pend:null },
  { id:'tyck',  x:140,  y:416, role:'verify', title:'typecheck', sub:'ty · signatures with teeth',
    desc:'ADR-0017’s second required check: ty over src/, its OWN job beside quality_check so the compiled checker never enters another job’s environment — a CI-only dev tool outside the gate’s runtime trust boundary, holding no secrets and running on every PR from any fork. It is what makes the parsed-step signatures enforcement rather than documentation: a phase whose signature takes parse_plan’s Steps cannot quietly go back to taking the raw dict. Hash-pinned from PyPI like everything else the runner installs; mypy is the recorded fallback if ty’s inference proves too shallow. Eval fixture trees (pr_root/) are excluded — they play the CONTRIBUTOR’s code, deliberately defective and never imported by the harness.',
    files:'ty.toml · requirements-typecheck.txt', ev:'Baseline pass done: 40 diagnostics → 0 — 20 were fixture trees (excluded), 18 the str|int args residue ADR-0017 anticipated (cast at the readers that know their kind’s spec), plus NoReturn on github_api.fail and two honest casts.', pend:null },
  { id:'qc',    x:140,  y:488, role:'verify', title:'quality_check', sub:'free, fast, blocking',
    desc:'The deterministic suite on every PR from any fork: 2064 pytest (verifier, plan verifier, both adversarial corpora, hypothesis properties, harness logic). One runner since ADR-0016 retired the prover and its differential job. No secrets anywhere in this job, which is the standing rule that keeps it gate-free: anything needing a credential belongs in the gated evals job. Also asserts the hash-pinned lockfiles still agree with the requirements they were compiled from, so a bumped declaration cannot merge untested.',
    files:'tests/', ev:'<b>2064</b> green.', pend:null },
  { id:'trust', x:140,  y:560, role:'verify', title:'eval_author_trust', sub:'real permission, not association',
    desc:'Resolves the author’s actual repository permission via the API — author_association is a social relationship, not access. Checked out at the BASE ref, always: the PR must never supply the code that decides whether to trust the PR. Holds no secrets.',
    files:'author_trust.py', ev:'Ran and passed on the test PR.', pend:null },
  { id:'appr',  x:268,  y:560, role:'human',  title:'eval_approve', sub:'environment: required reviewers', gate:true,
    desc:'The human gate for untrusted or draft authors: their code does not run with a credential until a maintainer approves the ai-pr-review environment. Trusted non-draft authors skip it — and the downstream job re-derives trust rather than trusting the skip, because “skipped” alone cannot distinguish “author holds write” from “the gate failed to run”. Six observed failure modes are recorded in the 0006 addendum; environment_gate.py asserts the gate inside the gated job, and asserts BOTH halves — that a required_reviewers rule exists, and that every eligible reviewer holds write-or-above, since a read-only reviewer can approve their own deployment and reach the credential.',
    files:'evals.yml · environment_gate.py · environment ai-pr-review', ev:'On the test PR it <b>skipped</b> for the trusted author and the evals job ran via the re-derivation branch. 23 tests cover the gate, each refusal mutation-verified.', pend:null },
  { id:'ejob',  x:396,  y:560, role:'exec',   title:'evals job', sub:'the only credentialed job', gate:true,
    desc:'Runs behind the ai-pr-review-runtime environment, whose protection is a branch policy — the Bedrock role’s trust policy requires this exact environment in the OIDC subject, and an inline session policy caps the token to bedrock:InvokeModel on one inference profile. Checkout uses persist-credentials:false because this job executes the PR’s own code — and every step that runs that code has ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN shadowed empty, or the code could mint a second OIDC token and re-assume the role with no session policy at all. Either suite reports one verdict per scenario whatever happens: a scenario’s own fault is that scenario’s failed result, never a traceback where a suite summary belongs, and --runs below 1 is refused rather than exiting 0 having evaluated nothing.',
    files:'evals.yml · run_evals.py · run_plan_evals.py', ev:'Both suites live on the test PR: review <b>11/11</b>, plan <b>5/5</b>. Weekly schedule still catches upstream model drift.', pend:null },
  { id:'eres',  x:524,  y:560, role:'data',   title:'Graded results', sub:'behaviour, not shape',
    desc:'Review scenarios grade planted defects, injection resistance, and recovery. Plan scenarios grade the ADR-0009 invariants — fix kinds uniform, write chain iff patch, scope discipline — never step inventories, so the graders pin policy rather than today’s prompt. --runs 3 before believing any behaviour change.',
    files:'evals/scenarios/ (11) · evals/plan_scenarios/ (5) · expect.json each', ev:'Redacted transcripts upload as a 30-day artifact.', pend:null },
];

const EDGES = [
  { from:'pr',   to:'ctx' }, { from:'ctx',  to:'gen' }, { from:'gen',  to:'ver', label:'submit_review' },
  { from:'ver',  to:'art', label:'verified' }, { from:'art',  to:'post' }, { from:'post', to:'cmt' },
  { from:'ver',  to:'gen', type:'reject', label:'rejected: real reason (≤4, breaker)' },

  { from:'pol', to:'ver',  type:'reads' }, { from:'pol', to:'pver', type:'reads' },

  { from:'fix',  to:'fnd' }, { from:'fnd',  to:'pgen' }, { from:'pgen', to:'pver', label:'submit_plan' },
  { from:'pver', to:'plan', label:'verified' }, { from:'plan', to:'pexec' },
  { from:'pver', to:'pgen', type:'reject', label:'rejected (same breaker)' },
  { from:'pexec', to:'sug', label:'1 file, 1 hunk' },
  { from:'pexec', to:'spr', label:'multi-file (atomic)' },
  { from:'pexec', to:'dec', type:'reject', label:'already delivered · stranded' },
  { from:'fix',  to:'dec', type:'reject', label:'no delivery exists', bend: 1 },
  { from:'spr',  to:'dec', label:'delivered → receipt' },

  { from:'cipr', to:'qc' }, { from:'cipr', to:'tyck' }, { from:'cipr', to:'trust' },
  { from:'trust', to:'appr', label:'untrusted / draft → wait', labelPos:'below' },
  { from:'appr', to:'ejob', label:'approved · or skipped + trust re-derived' },
  { from:'ejob', to:'eres' },
];

const FLOWS = {
  review: { color:'var(--role-verify)', steps:['pr','ctx','gen','ver','art','post','cmt'] },
  plan:   { color:'var(--role-exec)',   steps:['fix','fnd','pgen','pver','plan','pexec','sug','spr','dec'] },
  reject: { color:'var(--role-model)',  steps:['gen','ver','gen','ver','art'] },
  ci:     { color:'var(--role-human)',  steps:['cipr','trust','appr','ejob','eres'] },
};

const ROLE_NAMES = { model:'Model — untrusted generator', verify:'Deterministic gate', human:'Human gate', exec:'Trusted effect / credential', data:'Inert artifact / data' };
const ROLE_VARS  = { model:'--role-model', verify:'--role-verify', human:'--role-human', exec:'--role-exec', data:'--baseline' };

const canvas = document.getElementById('canvas');
const svg = document.getElementById('edges');
const panel = document.getElementById('panel');
const byId = {};

const LANES = [
  { y: 20,  label: 'REVIEW — in production' },
  { y: 248, label: 'REMEDIATION — wired end to end; suggestions deliver, stacked PR pending' },
  { y: 452, label: 'CI TRUST GATES — live-tested today' },
];
for (const lane of LANES) {
  const l = document.createElement('div');
  l.className = 'lane-label'; l.style.top = (lane.y) + 'px'; l.textContent = lane.label;
  canvas.appendChild(l);
  const r = document.createElement('div');
  r.className = 'lane-rule'; r.style.top = (lane.y - 8) + 'px';
  canvas.appendChild(r);
}

for (const n of NODES) {
  const el = document.createElement('div');
  el.className = 'node ' + n.role + (n.pending ? ' pending' : '');
  el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
  el.tabIndex = 0; el.setAttribute('role', 'button');
  el.setAttribute('aria-label', n.title + (n.gate ? ' (gate)' : ''));
  el.innerHTML = '<span class="k">' + n.title + '</span><span class="s">' + n.sub + '</span>'
    + (n.gate ? '<span class="gate-cap">⛨ gate</span>' : '')
    + (n.pending ? '<span class="badge">planned</span>' : (n.ev ? '<span class="badge" style="color:var(--status-good)">✓</span>' : ''));
  el.addEventListener('click', () => select(n.id));
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(n.id); } });
  canvas.appendChild(el);
  byId[n.id] = { data: n, el };
}

function rect(id) {
  const el = byId[id].el;
  return { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
}

function edgePath(e) {
  const a = rect(e.from), b = rect(e.to);
  if (e.type === 'reject') {
    const sx = a.x + a.w * 0.35, sy = a.y + a.h;
    const tx = b.x + b.w * 0.65, ty = b.y + b.h;
    const dip = Math.max(sy, ty) + 26;
    return { d: `M ${sx} ${sy} C ${sx} ${dip}, ${tx} ${dip}, ${tx} ${ty}`, lx: (sx + tx) / 2, ly: dip + 12, anchor: 'middle' };
  }
  if (e.type === 'reads') {
    const sx = a.x + a.w / 2, sy0 = a.y, sy1 = a.y + a.h;
    const tx = b.x + b.w / 2;
    if (b.y > a.y) { // downward
      const bend = e.bend ? 40 : 0;
      return { d: `M ${sx} ${sy1} C ${sx + bend} ${sy1 + 40}, ${tx} ${b.y - 40}, ${tx} ${b.y}`, lx: 0, ly: 0 };
    }
    return { d: `M ${sx} ${sy0} C ${sx} ${sy0 - 40}, ${tx} ${b.y + b.h + 40}, ${tx} ${b.y + b.h}`, lx: 0, ly: 0 };
  }
  // forward flow
  const sy = a.y + a.h / 2, ty = b.y + b.h / 2;
  const sx = a.x + a.w, tx = b.x;
  if (Math.abs(a.y - b.y) < 4 && tx >= sx) {
    const ly = e.labelPos === 'below' ? Math.max(a.y + a.h, b.y + b.h) + 14 : Math.min(a.y, b.y) - 6;
    const my = (sy + ty) / 2;
    return { d: `M ${sx} ${my} L ${tx} ${my}`, lx: (sx + tx) / 2, ly, anchor: 'middle' };
  }
  if (tx >= sx) { // forward with vertical offset (forks, ci column)
    const mx = (sx + tx) / 2;
    return { d: `M ${sx} ${sy} C ${mx} ${sy}, ${mx} ${ty}, ${tx} ${ty}`, lx: mx, ly: (sy + ty) / 2 - 6, anchor: 'middle' };
  }
  // downward (cipr -> trust/qc when stacked)
  const sx2 = a.x + a.w, sy2 = a.y + a.h / 2;
  return { d: `M ${sx2} ${sy2} C ${sx2 + 40} ${sy2}, ${tx - 40} ${ty}, ${tx} ${ty}`, lx: (sx2 + tx) / 2, ly: (sy2 + ty) / 2 - 6, anchor: 'middle' };
}

const edgeEls = [];
for (const e of EDGES) {
  const p = edgePath(e);
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', p.d);
  path.setAttribute('class', 'edge' + (e.type ? ' ' + e.type : ''));
  if (e.type !== 'reads') path.setAttribute('marker-end', 'url(#arr)');
  svg.appendChild(path);
  let labelEl = null;
  if (e.label && p.lx) {
    labelEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    labelEl.setAttribute('x', p.lx); labelEl.setAttribute('y', p.ly);
    labelEl.setAttribute('text-anchor', p.anchor || 'middle');
    labelEl.setAttribute('class', 'edge-label');
    labelEl.textContent = e.label;
    svg.appendChild(labelEl);
  }
  edgeEls.push({ e, path, labelEl });
}

function select(id) {
  for (const k in byId) byId[k].el.classList.toggle('selected', k === id);
  const n = byId[id].data;
  const color = `var(${ROLE_VARS[n.role]})`;
  panel.innerHTML = `
    <h2>${n.title}${n.gate ? ' ⛨' : ''}</h2>
    <div class="role-chip"><span class="role-dot" style="background:${color}"></span>${ROLE_NAMES[n.role]}${n.pending ? ' · designed, not built' : ''}</div>
    <p>${n.desc}</p>
    ${n.files ? `<h3>Where</h3><div class="files">${n.files}</div>` : ''}
    ${n.ev ? `<h3>Evidence</h3><div class="ev">${n.ev}</div>` : ''}
    ${n.pend ? `<h3>Pending</h3><div class="pend">${n.pend}</div>` : ''}
  `;
}

function clearFlow() {
  document.getElementById('root').style.removeProperty('--hlc');
  for (const k in byId) byId[k].el.classList.remove('lit');
  for (const { path, labelEl } of edgeEls) { path.classList.remove('lit'); path.setAttribute('marker-end', path.classList.contains('reads') ? '' : 'url(#arr)'); if (labelEl) labelEl.classList.remove('lit'); }
  for (const b of document.querySelectorAll('.flow-btn')) b.classList.remove('on');
}

let flowTimer = null;
function playFlow(name, btn) {
  clearFlow();
  if (flowTimer) { clearInterval(flowTimer); flowTimer = null; }
  if (!name) return;
  btn.classList.add('on');
  const flow = FLOWS[name];
  document.getElementById('root').style.setProperty('--hlc', flow.color);
  let i = 0;
  const step = () => {
    if (i >= flow.steps.length) { clearInterval(flowTimer); flowTimer = null; return; }
    const id = flow.steps[i];
    byId[id].el.classList.add('lit');
    byId[id].el.style.setProperty('--hl', flow.color);
    if (i > 0) {
      const prev = flow.steps[i - 1];
      for (const { e, path, labelEl } of edgeEls) {
        if (e.from === prev && e.to === id) {
          path.classList.add('lit');
          if (!path.classList.contains('reads')) path.setAttribute('marker-end', 'url(#arrLit)');
          if (labelEl) labelEl.classList.add('lit');
        }
      }
    }
    select(id);
    i += 1;
  };
  step();
  flowTimer = setInterval(step, 1800);
}

for (const b of document.querySelectorAll('.flow-btn')) {
  b.addEventListener('click', () => playFlow(b.dataset.flow, b));
}

document.getElementById('themeBtn').addEventListener('click', () => {
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.setAttribute('data-theme', dark ? 'light' : 'dark');
});

// default panel: the architecture in one breath
panel.innerHTML = `
  <h2>The architecture</h2>
  <p><b>Generate → verify → execute.</b> Model output is untrusted data, never
  instructions. A deterministic verifier proves it satisfies a policy held as
  reviewable data. A trusted executor renders the verified artifact and performs
  the effect. The generator holds no write credential and calls no write API.</p>
  <p>Three lanes: the <b>review</b> pipeline (in production), the
  <b>remediation</b> pipeline (generator and both gates built and live-tested;
  executor designed, pending), and the <b>CI trust gates</b> that decide whose
  code may run with the one credential in the repository.</p>
  <p>Gates are marked ⛨. Two kinds alternate through every path: deterministic
  ones (blue) that bound <i>what</i> an artifact can say and touch, and human
  ones (green) that decide <i>whether</i> it happens — the PR merge, the
  suggestion click, the environment approval. The system’s claim is that no
  model output reaches an effect without passing at least one of each.</p>
  <h3>Today’s live evidence</h3>
  <div class="ev">Test PR #1 (run 30617003684): trigger fired on <b>opened</b>,
  gate <b>skipped</b> correctly for a trusted author, review suite <b>11/11</b>,
  plan suite <b>5/5</b> under the scoped Bedrock role.</div>
  <p style="color:var(--text-muted); font-size:12px">Click any node for its role,
  checks, and evidence — or play a flow above.</p>
`;
</script>
</body>
</html>
